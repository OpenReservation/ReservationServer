services:
  db:
    container_name: npgsql
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_DB: Reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: Admin888
    networks:
      - reservation
    volumes:
      - "./docker/healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
  
  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    networks:
      - reservation
    volumes:
      - "./docker/healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
  
  aspire-dashboard:
    container_name: aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    restart: always
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - 28888:18888
    #   - 4317:18889
    networks:
      - reservation

  reservation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation
    environment:
      # - 'Reservation_AppSettings__DbType=SqlServer'
      # - 'Reservation_ConnectionStrings__Reservation=server=db;database=Reservation;uid=sa;pwd=Admin888;'
      - 'Reservation_AppSettings__DbType=Npgsql'
      - 'Reservation_ConnectionStrings__Reservation=server=db;database=Reservation;uid=reservation;pwd=Admin888;'
      - 'Reservation_ConnectionStrings__Redis=redis'
      - 'Reservation_OpenTelemetry__OtlpExporter__Url=http://aspire-dashboard:18889'
    ports:
      - 65026:80
    networks:
      - reservation
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    links:
      - db:db
      - redis:redis
      - aspire-dashboard:aspire-dashboard

networks:
  reservation: