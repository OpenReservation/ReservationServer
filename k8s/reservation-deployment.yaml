apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-app
  namespace: default
  labels:
    app: reservation-app
spec:
  replicas: 1
  revisionHistoryLimit: 2 # how many old ReplicaSets for this Deployment you want to retain, https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#clean-up-policy
  selector:
    matchLabels:
      app: reservation-app
  minReadySeconds: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: reservation-app
    spec:
      containers:        
        - name: reservation-app
          image: openreservation/reservation-server:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 80m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          ports:
            - containerPort: 80
          env:
          - name: OTEL_SERVICE_NAME
            value: "reservation-app"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://aspire-dashboard:4317"
          volumeMounts:
          - name: settings
            mountPath: /app/appsettings.Production.json
            subPath: appsettings
      volumes:
        - name: settings
          configMap:
            name: reservation-configs

---
apiVersion: v1
kind: Service
metadata:
  name: reservation-app
spec:
  selector:
    app: reservation-app
  #type: ClusterIP
  type: NodePort
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 31220
  # - name: dotnet-monitor
  #   port: 52323
  #   protocol: TCP
  #   targetPort: 52323
